[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Scooter", email = "Scooter@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.143.2",
    "greenlet>=3.5.6",
    "pillow>=11.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.4",
    "starlette>=1.8.0",
]

[project.scripts]
fastapi-blog = "fastapi_blog:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
